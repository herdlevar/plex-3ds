name: Build Plex3DS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile 3DS Binaries & Run Tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          dkp-pacman -S --needed --noconfirm 3ds-curl 3ds-mpg123 3ds-flac 3ds-libogg || true
          which python3 || (apt-get update && apt-get install -y python3) || true

      - name: Run Core Test Suite
        run: |
          make test

      - name: Build Plex3DS
        run: |
          make -j$(nproc)

      - name: Build CIA Package
        run: |
          curl -sL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip -o makerom.zip
          python3 -c "import zipfile; zipfile.ZipFile('makerom.zip').extract('makerom', '/usr/local/bin')" || unzip -q makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom

          curl -sL https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz -o bannertool.tar.gz
          tar -xzf bannertool.tar.gz
          cp bannertool-1.2.3-linux/bannertool /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool

          bannertool makebanner -i banner.png -a silent.wav -o banner.bnr
          makerom -f cia -o Plex3DS.cia -elf Plex3DS.elf -rsf Plex3DS.rsf -icon Plex3DS.smdh -banner banner.bnr -exefslogo -target t

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plex3DS-latest
          path: |
            Plex3DS.3dsx
            Plex3DS.smdh
            Plex3DS.cia

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Plex3DS-latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Plex3DS.3dsx
            Plex3DS.smdh
            Plex3DS.cia
          draft: false
          prerelease: false
          generate_release_notes: true
